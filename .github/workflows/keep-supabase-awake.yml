# Безкоштовний тариф Supabase присипляє проєкт приблизно через тиждень
# без звернень до бази. Для магазину це означає повну зупинку продажів:
# кнопка тарифу не створить замовлення, і людина навіть не дійде до
# сторінки оплати.
#
# Продажі йдуть нерівномірно — між потоками буває тиша по кілька днів,
# і саме тоді проєкт засинає. Тому будимо його самі.
#
# Окремої функції для цього не треба: /api/get-invite з токеном
# правильного формату, але неіснуючим, робить справжній SELECT і віддає
# 404. Перевірено за часом відповіді — 1.7 с проти 0.5 с, коли токен
# відкидається регуляркою ще до бази.
name: keep-supabase-awake

on:
  schedule:
    # Щодня о 09:00 UTC. Поріг засинання — близько 7 днів, тож запас
    # великий навіть якщо кілька запусків пропустяться.
    - cron: '0 9 * * *'
  workflow_dispatch: # можна смикнути вручну з вкладки Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Розбудити базу через /api/get-invite
        run: |
          URL="https://marinek.store/api/get-invite?t=$(printf '0%.0s' {1..48})"
          CODE=$(curl -sS -o /tmp/body.json -w '%{http_code}' --max-time 30 "$URL")
          echo "HTTP $CODE — $(cat /tmp/body.json)"

          # 404 — очікувана відповідь: формат токена правильний, запит до
          # бази пройшов, замовлення не знайдено. Це і є ознака живої бази.
          # 200 малоймовірне, але теж означає робочу базу.
          if [ "$CODE" != "404" ] && [ "$CODE" != "200" ]; then
            echo "::error::База або функція не відповідають (HTTP $CODE). Перевірте, чи не призупинений проєкт Supabase."
            exit 1
          fi
          echo "База жива."
